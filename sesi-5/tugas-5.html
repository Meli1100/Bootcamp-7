<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Data Produk</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">

    <div class="container py-5">
        <h2 class="mb-4" text-center>Data Produk</h2>

    <!-- Fitur & Search -->
     <div class="row mb-4">
        <div class="col-md-4 mb-2">
            <input type="text" id="searchInput" class="form-control" placeholder="Cari produk...">
        </div>

    <div class="col-md-4 mb-2">
        <select id="filterKatergori" class="form-select">
            <option value="">Semua Kategori</option>
            <option value="Elektronik">Elektronik</option>
            <option value="Pakaian">Fashion</option>
            <option value="Makanan">Makanan</option>
        </select>
    </div>

    <div class="col-md-4 mb-2">
        <select id="sortHarga" class="form-select">
            <option value="">Urutkan Harga</option>
            <option value="asc">Tertinggi</option>
            <option value="desc">Terendah</option>
        </select>
        </div>
    </div>

    <!-- List Produk -->
    <div class="row" id="productList"></div>
    </div>

<script src="tugas.js"></script>

</body>
</html>
